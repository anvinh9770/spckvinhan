
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng Ký - Food Menu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <i class="fa-solid fa-utensils"></i> Food Menu
        </a>
        <a href="dangnhap.html" class="btn btn-outline-light">
            Đăng nhập
        </a>
    </div>
</nav>

<section class="container my-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 450px;">

        <h2 class="text-center text-primary mb-4">
            <i class="fa-solid fa-user-plus"></i>
            Đăng Ký
        </h2>

        <form id="registerForm">

            <div class="mb-3">
                <label class="form-label">Họ và tên</label>
                <input type="text" id="fullname"
                       class="form-control"
                       placeholder="Nhập họ tên" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" id="username"
                       class="form-control"
                       placeholder="Nhập tên đăng nhập" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email"
                       class="form-control"
                       placeholder="Nhập email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" id="password"
                       class="form-control"
                       placeholder="Nhập mật khẩu" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword"
                       class="form-control"
                       placeholder="Nhập lại mật khẩu" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Đăng ký
            </button>

            <p class="text-center mt-3 mb-0">
                Đã có tài khoản?
                <a href="dangnhap.html">Đăng nhập</a>
            </p>

        </form>

        <div id="message" class="mt-3"></div>

    </div>
</section>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let fullname = document.getElementById("fullname").value.trim();
    let username = document.getElementById("username").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;
    let confirm = document.getElementById("confirmPassword").value;

    if (password !== confirm) {
        document.getElementById("message").innerHTML =
            '<div class="alert alert-danger">Mật khẩu không khớp!</div>';
        return;
    }

    let users = JSON.parse(localStorage.getItem("users")) || [];

    if (users.some(user => user.username === username)) {
        document.getElementById("message").innerHTML =
            '<div class="alert alert-danger">Tên đăng nhập đã tồn tại!</div>';
        return;
    }

    users.push({
        fullname: fullname,
        username: username,
        email: email,
        password: password
    });

    localStorage.setItem("users", JSON.stringify(users));

    document.getElementById("message").innerHTML =
        '<div class="alert alert-success">Đăng ký thành công! Đang chuyển đến trang đăng nhập...</div>';
    setTimeout(function() { window.location.href = "dangnhap.html"; }, 1200);
});
</script>

<script src="app.js"></script>
</body>
</html>
