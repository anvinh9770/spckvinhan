
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng Nhập - Food Menu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <i class="fa-solid fa-utensils"></i> Food Menu
        </a>
        <a href="dangky.html" class="btn btn-outline-light">
            Đăng ký
        </a>
    </div>
</nav>

<section class="container my-5">

    <div class="card shadow p-4 mx-auto" style="max-width: 450px;">

        <h2 class="text-center text-primary mb-4">
            <i class="fa-solid fa-user"></i>
            Đăng Nhập
        </h2>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" id="username"
                       class="form-control"
                       placeholder="Nhập tên đăng nhập" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" id="password"
                       class="form-control"
                       placeholder="Nhập mật khẩu" required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                <i class="fa-solid fa-right-to-bracket"></i>
                Đăng nhập
            </button>

            <p class="text-center mt-3 mb-0">
                Chưa có tài khoản?
                <a href="dangky.html">Đăng ký ngay</a>
            </p>

        </form>

        <div id="message" class="mt-3"></div>

    </div>

</section>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value;

    let users = JSON.parse(localStorage.getItem("users")) || [];

    let user = users.find(function(item) {
        return item.username === username &&
               item.password === password;
    });

    if (user) {
        localStorage.setItem("currentUser", JSON.stringify(user));

        sessionStorage.setItem("loginSuccess", "true");
        window.location.href = "index.html";
    } else {
        document.getElementById("message").innerHTML =
            '<div class="alert alert-danger">Tên đăng nhập hoặc mật khẩu không đúng!</div>';
    }
});
</script>

<script src="app.js"></script>
</body>
</html>
