<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý tài khoản - Food Menu</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><nav class="navbar"><div class="container"><a class="navbar-brand" href="index.html"><i class="fa-solid fa-utensils"></i> Food Menu</a><a class="btn btn-outline-orange" href="index.html">Trang chủ</a></div></nav>
<main class="container my-5"><div class="contact-form mx-auto" style="max-width:560px"><div class="text-center mb-4"><div class="account-avatar mx-auto"><i class="fa-solid fa-user"></i></div><h2 class="fw-bold">Quản lý tài khoản</h2><p class="text-muted">Thông tin tài khoản Food Menu của bạn</p></div><div id="account-info"></div><a href="dangnhap.html" class="btn btn-orange w-100 mt-3" id="account-login">Đăng nhập</a><button class="btn btn-outline-danger w-100 mt-2" id="account-logout" style="display:none">Đăng xuất</button></div></main>
<footer><h4><i class="fa-solid fa-utensils"></i> Food Menu</h4><p>© 2026 Food Menu. All Rights Reserved.</p></footer><script src="app.js"></script>
<script>
const user=JSON.parse(localStorage.getItem("currentUser")||"null"),info=document.getElementById("account-info");
if(user){info.innerHTML=`<p><strong>Họ và tên:</strong> ${String(user.fullname||"").replace(/[&<>"]/g,"")}</p><p><strong>Tên đăng nhập:</strong> ${String(user.username||"").replace(/[&<>"]/g,"")}</p><p><strong>Email:</strong> ${String(user.email||"").replace(/[&<>"]/g,"")}</p>`;document.getElementById("account-login").style.display="none";document.getElementById("account-logout").style.display="block";document.getElementById("account-logout").onclick=()=>{localStorage.removeItem("currentUser");location.href="index.html";};}else{info.innerHTML='<div class="alert alert-warning">Bạn chưa đăng nhập.</div>';}
</script></body></html>
