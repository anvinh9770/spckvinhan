<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Giỏ Hàng - Food Menu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html"><i class="fa-solid fa-utensils"></i> Food Menu</a>

        <div class="navbar-nav ms-auto flex-row flex-wrap gap-2">
          <a class="nav-link" href="index.html"><i class="fa-solid fa-house"></i> Trang chủ</a>
          <a class="nav-link" href="monan.html"><i class="fa-solid fa-bowl-food"></i> Món ăn</a>
          <a class="nav-link" href="douong.html"><i class="fa-solid fa-mug-saucer"></i> Đồ uống</a>
          <a class="nav-link" href="dochay.html"><i class="fa-solid fa-leaf"></i> Món chay</a>
          <a class="nav-link" href="lienhe.html"><i class="fa-solid fa-phone"></i> Liên hệ</a>
          <a class="nav-link active" href="giohang.html"><i class="fa-solid fa-cart-shopping"></i> Giỏ hàng</a>
        </div>
      </div>
    </nav>

    <section class="banner">
      <div class="container">
        <h1>Giỏ Hàng</h1>
        <p>Trang mô phỏng giỏ hàng bằng HTML, CSS và Bootstrap.</p>
      </div>
    </section>

    <main class="container my-5">
      <!-- Ghi chú GV: Đây là giỏ hàng mẫu. Khi chưa học JavaScript, dữ liệu chưa tự thay đổi theo món đã bấm. -->
      <div class="cart-page">
        <div class="table-responsive">
          <table class="table table-bordered align-middle text-center">
            <thead><tr><th>STT</th><th>Tên món</th><th>Số lượng</th><th>Giá</th><th>Thành tiền</th><th>Thao tác</th></tr></thead><tbody id="cart-list"></tbody>
          </table>
        </div>

        <div class="cart-total">
          <h4>Tổng tiền: <span id="total-money">0đ</span></h4>
          
          <div class="d-flex flex-wrap gap-2 justify-content-end">
            <a href="monan.html" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left"></i> Tiếp tục chọn món</a>
            <button class="btn btn-orange" type="button" onclick="alert('Chức năng đặt hàng sẽ được bổ sung ở bước tiếp theo!')"><i class="fa-solid fa-check"></i> Đặt hàng</button>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <h4><i class="fa-solid fa-utensils"></i> Food Menu</h4>
      <p>© 2026 Food Menu. All Rights Reserved.</p>
    </footer>
  <script src="app.js"></script>
</body>
</html>
